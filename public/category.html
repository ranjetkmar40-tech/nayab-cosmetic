
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Products | Nayab Cosmetic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: #fff7fa;
      color: #422633;
    }

    header {
      background: #c2185b;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h2 {
      font-size: 23px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .heading {
      text-align: center;
      padding: 30px 15px 20px;
    }

    .heading h1 {
      color: #c2185b;
      margin-bottom: 8px;
    }

    .heading p {
      color: #777;
      font-size: 14px;
    }

    #searchInput {
      display: block;
      width: min(90%, 450px);
      margin: 0 auto 25px;
      padding: 12px 15px;
      border: 1px solid #e4b3c7;
      border-radius: 25px;
      font-size: 15px;
      outline-color: #c2185b;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 0 5% 40px;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000012;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 7px 18px #00000018;
    }

    .product-card img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: white;
    }

    .product-info {
      padding: 14px;
    }

    .product-category {
      display: inline-block;
      color: #c2185b;
      background: #fff0f5;
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .product-info h3 {
      font-size: 16px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
      min-height: 24px;
    }

    .price {
      color: #c2185b;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 14px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .product-actions button {
      flex: 1;
      padding: 10px 5px;
      border: none;
      border-radius: 7px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-cart {
      background: #f9e3ec;
      color: #ad2459;
    }

    .add-cart:hover {
      background: #f1cbdc;
    }

    .buy-now {
      background: #c2185b;
      color: white;
    }

    .buy-now:hover {
      background: #941046;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    @media (max-width: 420px) {
      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding-left: 12px;
        padding-right: 12px;
      }

      .product-card img {
        height: 160px;
      }

      .product-info {
        padding: 10px;
      }

      .product-info h3 {
        font-size: 14px;
      }

      .product-actions {
        flex-direction: column;
      }

      .product-actions button {
        width: 100%;
        padding: 10px 4px;
        font-size: 12px;
      }

      header h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>🌸 Nayab Cosmetic</h2>
    <a href="/">← Customer Dashboard</a>
  </header>

  <section class="heading">
    <h1 id="categoryTitle">Products</h1>
    <p>इस कैटेगरी के सभी उपलब्ध प्रोडक्ट</p>
  </section>

  <input
    type="search"
    id="searchInput"
    placeholder="इस कैटेगरी में प्रोडक्ट खोजें..."
    aria-label="प्रोडक्ट खोजें"
  >

  <main class="products" id="productGrid">
    <div class="empty">प्रोडक्ट लोड हो रहे हैं...</div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const category = params.get("category") || "";
    const productGrid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");

    let categoryProducts = [];

    document.getElementById("categoryTitle").textContent =
      category ? category + " Products" : "Products";

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };
        return entities[char];
      });
    }

    function openOrder(product) {
      const params = new URLSearchParams({
        name: product.name || "",
        price: String(Number(product.price) || 0),
        image: product.image || "",
        category: product.category || ""
      });

      window.location.href = "order.html?" + params.toString();
    }

    function renderProducts() {
      const search = searchInput.value.trim().toLowerCase();

      const filtered = categoryProducts.filter(product =>
        (product.name || "").toLowerCase().includes(search)
      );

      if (filtered.length === 0) {
        productGrid.innerHTML =
          '<div class="empty">इस कैटेगरी में कोई प्रोडक्ट नहीं मिला।</div>';
        return;
      }

      productGrid.innerHTML = filtered.map((product, index) => {
        const name = escapeHTML(product.name || "Cosmetic Product");
        const categoryName = escapeHTML(product.category || "");
        const image = escapeHTML(product.image || "");
        const price = Number(product.price) || 0;

        return `
          <article class="product-card">
            <img
              src="${image}"
              alt="${name}"
              loading="lazy"
              onerror="this.onerror=null;this.src='https://placehold.co/500x500/f8edf1/ad3e6c?text=Nayab+Cosmetic'"
            >

            <div class="product-info">
              <div class="product-category">${categoryName}</div>
              <h3>${name}</h3>

              <div class="price">
                ₹${price.toLocaleString("en-IN")}
              </div>

              <div class="product-actions">
                <button
                  type="button"
                  class="add-cart"
                  data-index="${index}"
                  data-action="cart"
                >
                  🛒 Add to Cart
                </button>

                <button
                  type="button"
                  class="buy-now"
                  data-index="${index}"
                  data-action="buy"
                >
                  Buy Now
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    productGrid.addEventListener("click", function (event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const index = Number(button.dataset.index);
      const product = categoryProducts.filter(item =>
        (item.name || "").toLowerCase().includes(
          searchInput.value.trim().toLowerCase()
        )
      )[index];

      if (!product) {
        alert("प्रोडक्ट नहीं मिला। कृपया दोबारा कोशिश करें।");
        return;
      }

      openOrder(product);
    });

    async function loadProducts() {
      try {
        if (!category) {
          throw new Error("Category nahi mili");
        }

        const response = await fetch("/api/products");

        if (!response.ok) {
          throw new Error("Products load nahi hue");
        }

        const data = await response.json();

        const products = Array.isArray(data)
          ? data
          : (data.products || []);

        categoryProducts = products.filter(product =>
          (product.category || "").toLowerCase() === category.toLowerCase()
        );

        renderProducts();
      } catch (error) {
        console.error("Category products error:", error);

        productGrid.innerHTML =
          '<div class="empty">प्रोडक्ट लोड नहीं हुए। Dashboard पर वापस जाकर फिर कोशिश करें।</div>';
      }
    }

    searchInput.addEventListener("input", renderProducts);

    loadProducts();
  </script>
</body>
</html>
